[project]
name = "crypto-support-evals"
version = "0.1.0"
description = "Rag bot for crypto support"
readme = "README.md"
authors = [
    { name = "Denis Mordvinov", email = "8133967+Sublio@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
